services:
  postgres:
    image: postgres:16
    container_name: user-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d userdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: user-management-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://appuser:${POSTGRES_PASSWORD}@postgres:5432/userdb?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
